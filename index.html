<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#c0166a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="DOMAVi" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>DOMAVi Mortgage</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #F2EEF7; overflow-x: hidden; }
    #root { min-height: 100vh; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>
  <script>
    fetch('mortgage-calculator.jsx')
      .then(r => {
        if (!r.ok) throw new Error('Could not load mortgage-calculator.jsx (HTTP ' + r.status + ')');
        return r.text();
      })
      .then(code => {
        // Append mount call — no export default in the file anymore
        code += '\nReactDOM.createRoot(document.getElementById("root")).render(React.createElement(DomaviMortgage));';
        const out = Babel.transform(code, { presets: ['react'] }).code;
        eval(out);
      })
      .catch(e => {
        document.getElementById('root').innerHTML =
          '<div style="padding:40px;font-family:sans-serif;color:#c0166a"><h2>Error</h2><pre style="white-space:pre-wrap">' + e.message + '</pre></div>';
      });
  </script>
</body>
</html>
