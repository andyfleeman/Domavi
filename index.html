<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#c0166a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="DOMAVi" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>DOMAVi Mortgage</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #F2EEF7; overflow-x: hidden; }
    #root { min-height: 100vh; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script>
    fetch('mortgage-calculator.jsx')
      .then(r => r.text())
      .then(code => {
        // Remove export default so VantageMortgage becomes a plain global function
        code = code.replace('export default function VantageMortgage', 'function VantageMortgage');
        const transformed = Babel.transform(code, { presets: ['react'] }).code;
        const script = document.createElement('script');
        script.textContent = transformed;
        document.head.appendChild(script);
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(React.createElement(VantageMortgage));
      })
      .catch(e => {
        document.getElementById('root').innerHTML =
          '<div style="padding:40px;font-family:sans-serif;color:#c0166a">' +
          '<h2>Loading error</h2><pre>' + e.message + '</pre></div>';
      });
  </script>
</body>
</html>
